---
# .cpanel.yml — cPanel Git Version Control deployment configuration.
#
# On every `git push` to the connected branch, cPanel runs the `deploy` steps
# in order. This file is executed by cPanel's Git Version Control feature
# (not Passenger) — Passenger only handles serving the app.
#
# IMPORTANT: After the first deploy, SSH into the server and run:
#   cd ~/public_html   (or your deploy path below)
#   npm install --omit=dev
#   npm run build
#   (Passenger will pick up server.js automatically)
#
# On subsequent deploys a simple `npm run build` is enough unless
# you've added new packages (then run `npm install --omit=dev` again).

deployment:
  tasks:
    # Copy every tracked file to ~/public_html.
    # Adjust the destination path if your app lives in a subdirectory,
    # e.g. /home/$USER/public_html/roltek
    - export DEPLOYPATH=$HOME/public_html
    - /bin/cp -R . $DEPLOYPATH

    # ── Post-copy cleanup ────────────────────────────────────────────────────
    # Remove directories that must NOT be on the server
    # (they are either rebuilt there or are dev-only artefacts).
    - /bin/rm -rf $DEPLOYPATH/.git
    - /bin/rm -rf $DEPLOYPATH/.next
    - /bin/rm -rf $DEPLOYPATH/node_modules
    - /bin/rm -rf $DEPLOYPATH/out
    - /bin/rm -rf $DEPLOYPATH/src/.cache

    # ── Install production dependencies ─────────────────────────────────────
    # --omit=dev skips devDependencies (TypeScript, ESLint, etc.)
    - cd $DEPLOYPATH && npm install --omit=dev

    # ── Build the Next.js app ────────────────────────────────────────────────
    - cd $DEPLOYPATH && npm run build
